plugins { id "com.android.application" }
android {
    namespace "com.aether.engine"
    compileSdk 35
    ndkVersion "27.2.12479018"
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "com.aether.engine"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        externalNativeBuild { cmake { cppFlags "-std=c++20"; arguments "-DANDROID_STL=c++_shared" } }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-dev"
            debuggable true
            jniDebuggable true
            buildConfigField "boolean", "AETHER_DEBUG_TOOLS", "true"
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable false
            buildConfigField "boolean", "AETHER_DEBUG_TOOLS", "false"
            ndk { debugSymbolLevel "SYMBOL_TABLE" }
        }
    }
    externalNativeBuild { cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.22.1" } }
    packaging { jniLibs { useLegacyPackaging = false } }
}
